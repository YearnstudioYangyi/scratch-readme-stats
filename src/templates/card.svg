<svg width="400" height="150" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: __themeColor__;
            animation: fadeIn 0.8s ease-in-out forwards;
        }

        .stat {
            font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: __textColor__;
            opacity: 0;
            animation: slideIn 0.5s ease-in-out forwards;
        }

        .label {
            font-weight: 600;
        }

        .rank-text {
            font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: __themeColor__;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.2s;
        }

        .progress-bar {
            stroke-dasharray: __totalDash__;
            stroke-dashoffset: __totalDash__;
            animation: progress 1.2s ease-in-out forwards 0.4s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-15px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes progress {
            to {
                stroke-dashoffset: __targetOffset__;
            }
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .delay-1 {
            animation-delay: 0.2s;
        }

        .delay-2 {
            animation-delay: 0.4s;
        }
    </style>
    <rect x="0.5" y="0.5" rx="10" width="399" height="149" fill="__backgroundColor__" stroke="__borderColor__" />
    <text x="25" y="35" class="header">__username__@__rankSystem__ [__rankScore__]</text>
    <g transform="translate(25, 70)">
        <g class="stat delay-1">
            <text x="0" y="0" class="label">点赞/Star:</text>
            <text x="110" y="0">__likes__</text>
        </g>
        <g class="stat delay-2">
            <text x="0" y="30" class="label">作品数:</text>
            <text x="110" y="30">__works__</text>
        </g>
        <g class="stat delay-2">
            <text x="0" y="60" class="label">查看数:</text>
            <text x="110" y="60">__looks__</text>
        </g>
    </g>
    <g transform="translate(310, 80)">
        <circle r="40" cx="0" cy="0" stroke="__progressBarBg__" stroke-width="8" fill="none" />
        <circle r="40" cx="0" cy="0" stroke="__themeColor__" stroke-width="8" fill="none" stroke-linecap="round"
            class="progress-bar" transform="rotate(-90)" />
        <text x="0" y="8" text-anchor="middle" class="rank-text">__rankResult__</text>
    </g>
</svg>