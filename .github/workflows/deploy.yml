name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build project
        run: pnpm run build
        
      - name: Deploy to EdgeOne
        env:
          ZONE_ID: ${{ secrets.ZONE_ID }}
          FUNCTION_ID: ${{ secrets.FUNCTION_ID }}
          REMARK: ${{ secrets.REMARK }}
        run: |
          # 读取文件内容并编码为 base64
          content=$(cat dist/serverless/edgeone.mjs | base64 -w 0)
          
          # 构建 JSON 负载
          payload='{
            "ZoneId": "'"$ZONE_ID"'",
            "FunctionId": "'"$FUNCTION_ID"'",
            "Remark": "'"$REMARK"'",
            "Content": "'"$content"'"
          }'
          
          # 发送请求
          curl -X POST \
            -H "Host: teo.tencentcloudapi.com" \
            -H "Content-Type: application/json" \
            -H "X-TC-Action: ModifyFunction" \
            -d "$payload" \
            https://teo.tencentcloudapi.com
